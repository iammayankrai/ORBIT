services:
  - type: web
    name: orbit-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BRAND_NAME
        value: Orbit
      - key: AI_MODE
        value: demo
      - key: AI_DAILY_LIMIT
        value: "5"
      - key: AI_MAX_PROMPT_LENGTH
        value: "300"
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "15"
      # Secrets / deployment-specific values — set these in the Render
      # dashboard after the first deploy, not here.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

name: Keep backend warm

# Render's free tier spins the backend down after 15 minutes of inactivity,
# causing a 30-60s cold start on the next request. Pinging /health every 10
# minutes keeps it warm so real visitors never see that delay.
#
# Setup: Settings -> Secrets and variables -> Actions -> New repository
# secret, name BACKEND_HEALTH_URL, value https://<your-render-service>.onrender.com/health

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ secrets.BACKEND_HEALTH_URL }}" ]; then
            echo "BACKEND_HEALTH_URL secret not set yet — skipping. See comment at the top of this file."
            exit 0
          fi
          curl -sf "${{ secrets.BACKEND_HEALTH_URL }}" || echo "Ping failed (backend may be cold-starting)."

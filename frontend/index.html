<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Orbit turns any Excel or CSV into a full interactive dashboard in seconds — KPIs, trends, breakdowns, data quality and AI answers. Try live demos across sales, inventory, procurement, finance, HR and manufacturing."
    />
    <meta name="theme-color" content="#0e0d0b" />
    <script>
      // Set the theme before first paint so there is no light/dark flash.
      try {
        var t = localStorage.getItem('orbit-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Orbit — Turn Your Data Into Decisions</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
